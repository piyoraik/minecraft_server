---
- name: Minecraft Setup
  hosts: minecraft
  # このプレイの大半のタスクは root 権限を必要とするため Play レベルで become を設定する
  become: true
  gather_facts: false
  pre_tasks:
    - name: 接続確認のため facts を取得
      ansible.builtin.setup:
  roles:
    - common
    - java
    - linuxgsm
    - minecraft
    - wrapper-scripts
    - monitoring
