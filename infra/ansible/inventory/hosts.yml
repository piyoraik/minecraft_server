all:
  children:
    minecraft:
      hosts:
        minecraft-server:
          ansible_connection: amazon.aws.aws_ssm
          ansible_aws_ssm_instance_id: "{{ lookup('env', 'MINECRAFT_INSTANCE_ID') }}"
          ansible_aws_ssm_region: "{{ lookup('env', 'AWS_REGION') | default('ap-northeast-1', true) }}"
          ansible_aws_ssm_bucket_name: "{{ lookup('env', 'MINECRAFT_SSM_BUCKET') }}"
          ansible_python_interpreter: /usr/bin/python3
