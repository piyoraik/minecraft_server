---
- name: minecraft ユーザーを作成
  ansible.builtin.user:
    name: "{{ minecraft_user }}"
    shell: /bin/bash
    create_home: true

- name: 必要ディレクトリを作成
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ minecraft_user }}"
    group: "{{ minecraft_user }}"
    mode: "0755"
  loop:
    - "{{ minecraft_home }}"
    - "{{ linuxgsm_dir }}"
    - "{{ minecraft_server_dir }}"
