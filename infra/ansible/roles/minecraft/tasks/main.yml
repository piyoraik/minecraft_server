---
- name: バージョンマニフェストを取得
  ansible.builtin.uri:
    url: https://piston-meta.mojang.com/mc/game/version_manifest_v2.json
    return_content: true
  register: minecraft_version_manifest

- name: 対象バージョンのメタデータ URL を解決
  ansible.builtin.set_fact:
    minecraft_version_metadata_url: >-
      {{
        (
          minecraft_version_manifest.json.versions
          | selectattr('id', 'equalto', minecraft_version)
          | map(attribute='url')
          | first
        )
      }}

- name: 対象バージョンの存在を確認
  ansible.builtin.assert:
    that:
      - minecraft_version_metadata_url is string
      - minecraft_version_metadata_url | length > 0
    fail_msg: "minecraft_version={{ minecraft_version }} に対応する Mojang version metadata が見つかりません。"

- name: 対象バージョンのメタデータを取得
  ansible.builtin.uri:
    url: "{{ minecraft_version_metadata_url }}"
    return_content: true
  register: minecraft_version_metadata

- name: Minecraft サーバ JAR を配置
  ansible.builtin.get_url:
    url: "{{ minecraft_version_metadata.json.downloads.server.url }}"
    checksum: "sha1:{{ minecraft_version_metadata.json.downloads.server.sha1 }}"
    dest: "{{ minecraft_server_dir }}/minecraft_server.jar"
    owner: "{{ minecraft_user }}"
    group: "{{ minecraft_user }}"
    mode: "0644"

- name: LinuxGSM 設定ディレクトリを作成
  ansible.builtin.file:
    path: "{{ linuxgsm_dir }}/lgsm/config-lgsm/mcserver"
    state: directory
    owner: "{{ minecraft_user }}"
    group: "{{ minecraft_user }}"
    mode: "0755"

- name: LinuxGSM 用 mcserver.cfg を配置
  ansible.builtin.template:
    src: mcserver.cfg.j2
    dest: "{{ linuxgsm_dir }}/lgsm/config-lgsm/mcserver/mcserver.cfg"
    owner: "{{ minecraft_user }}"
    group: "{{ minecraft_user }}"
    mode: "0644"

- name: server.properties を配置
  ansible.builtin.template:
    src: server.properties.j2
    dest: "{{ minecraft_server_dir }}/server.properties"
    owner: "{{ minecraft_user }}"
    group: "{{ minecraft_user }}"
    mode: "0644"

- name: eula.txt を配置
  ansible.builtin.copy:
    dest: "{{ minecraft_server_dir }}/eula.txt"
    content: |
      eula=true
    owner: "{{ minecraft_user }}"
    group: "{{ minecraft_user }}"
    mode: "0644"
