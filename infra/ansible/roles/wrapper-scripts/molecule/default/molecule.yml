---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: wrapper-instance
    image: geerlingguy/docker-amazonlinux2023-ansible:latest
    pre_build_image: true
    privileged: false
    command: sleep infinity
    user: root
provisioner:
  name: ansible
  env:
    ANSIBLE_CONFIG: ${MOLECULE_PROJECT_DIRECTORY}/../../ansible.cfg
  config_options:
    defaults:
      remote_tmp: /tmp
  inventory:
    host_vars:
      wrapper-instance:
        wrapper_scripts_backup_bucket: molecule-backup-bucket
        wrapper_scripts_dir: /usr/local/bin
verifier:
  name: ansible
